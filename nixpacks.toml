[phases.setup]
nixPkgs = [
    "php82",

    "php82extensions.pdo_mysql",
    "php82extensions.mbstring",
    "php82extensions.openssl",
    "php82extensions.curl",
    "php82extensions.fileinfo",
    "composer",
    "nodejs"
]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm install",
    "npm run build",
    "php artisan config:clear",
    "php artisan view:clear"
]

[start]
cmd = "php artisan config:cache && php artisan route:cache && php artisan view:clear && php artisan storage:link && php artisan serve --host=0.0.0.0 --port=$PORT"
